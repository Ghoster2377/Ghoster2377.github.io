2) 14 числа Илья со стримом поехал на Vodka Party, где были стримеры с нижнего интернета — половина были очень трешовые. Дальше был полный разнос: Илья танцевал и бился шотами, а после Илюху повели в секретную комнату, где дальше он надеялся, что ему дадут копеечку.
